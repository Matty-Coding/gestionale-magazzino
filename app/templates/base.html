<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- meta tags for SEO -->
  <meta name="author" content="Matty-Coding">
  <meta name="description"
    content="Gestionale magazzino Full-Stack Project, backend Flask e frontend Tailwind e JavaScript Vanilla">

  <!-- favicon png format (size: 32x32) -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='logo.png') }}">

  <!-- CSRF token -->
  <meta name="csrf-token" content="{{ csrf_token() }}">

  <!-- import tailwind -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">

  <!-- import bootstrap icons -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">

  <!-- Jinja block title -->
  <title>{% block title %}{% endblock %}</title>

</head>

<body class="bg-slate-800 text-white">

  <!-- header per semantica e SEO -->
  <header>
    <!-- import della componente esterna per la nav bar condivisa -->
    {% include '/components/navbar.html' %}

    <!-- struttura hero section -->
    <h1>{% block hero %}{% endblock %}</h1>
    <h2>{% block subtitle %}{% endblock %}</h2>
  </header>

  <!-- main per contenuto core della pagina -->
  <main>
    <aside>{% block aside %}{% endblock %}</aside>
    <section>{% block main %}{% endblock %}</section>
  </main>

  <!-- import del componente per il footer condiviso -->
  {% include '/components/footer.html' %}
</body>

</html>
