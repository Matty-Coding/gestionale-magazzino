<table class="w-full text-left border-collapse">
  <thead class="sticky top-0 bg-zinc-800 text-gray-400 text-sm uppercase">
    <tr>
      <th class="p-4 border-b border-white/10">Username</th>
      <th class="p-4 border-b border-white/10">Email</th>
      <th class="p-4 border-b border-white/10">Ruolo</th>
      <th class="p-4 border-b border-white/10 text-center">Verificato</th>
      <th class="p-4 border-b border-white/10 text-center">Azioni</th>
    </tr>
  </thead>
  <tbody class="text-gray-300">
    {% for utente in items %}
    <tr class="border-b border-white/5 hover:bg-white/5 transition-colors">
      <td class="p-4 font-mono text-lime-400">{{ utente.username }}</td>
      <td class="p-4">{{ utente.email }}</td>
      <td class="p-4 text-sm">
        <span class="px-2 py-1 rounded bg-zinc-800 border border-white/10 uppercase text-xs">
          {{ utente.ruolo }}
        </span>
      </td>
      <td class="p-4 text-center">
        {% if utente.verificato %}
          <i class="bi bi-patch-check-fill text-lime-500" title="Verificato"></i>
        {% else %}
          <i class="bi bi-patch-exclamation text-red-500" title="Non verificato"></i>
        {% endif %}
      </td>
      <td class="p-4 text-center space-x-3">
        
        <button class="btn-edit text-blue-400 hover:scale-110 transition-transform cursor-pointer" 
                data-id="{{ utente.id }}"
                data-row='{
                    "username": "{{ utente.username }}", 
                    "email": "{{ utente.email }}", 
                    "ruolo": "{{ utente.ruolo }}",
                    "verificato": {{ "true" if utente.verificato else "false" }}
                }'>
          <i class="bi bi-pencil-square"></i>
        </button>
        
        <button class="btn-delete text-red-400 hover:scale-110 transition-transform cursor-pointer" 
                data-id="{{ utente.id }}"
                data-nome="{{ utente.username }}">
          <i class="bi bi-trash"></i>
        </button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
