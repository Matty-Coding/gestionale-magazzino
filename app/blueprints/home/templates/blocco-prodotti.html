{% for prodotto in prodotti.items %}
<article class="bg-black/60 rounded-lg border border-white 
    flex flex-col gap-1
    cursor-pointer 
    hover:bg-lime-500/30 hover:scale-95 transition-all duration-200 ease-in">
  <h2 class="text-center text-2xl font-bold">{{ prodotto.nome }}</h2>
  <p class="px-4"><span class="font-semibold">Codice: </span>{{ prodotto.codice }}</p>
  <p class="px-4"><span class="font-semibold">Quantità: </span>{{ prodotto.quantita }} disponibili</p>
  <p class="px-4 pb-4"><span class="font-semibold">Prezzo: </span>{{ prodotto.prezzo }}€</p>
</article>
{% endfor %}
